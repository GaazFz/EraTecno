<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Era Tecno</title>
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

  <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50 px-6 py-4 md:px-12">

  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <a href="../index.html"
      class="text-2xl md:text-3xl font-extrabold uppercase tracking-wider text-red-500 hover:scale-105 transition-transform duration-200 cursor-pointer">
      Era <span class="text-white">Tecno</span>
    </a>

    <!-- MENU DE ESCRITORIO -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-400">
      <a href="../index.html" class="text-white border-b-2 border-red-500 pb-1">Inicio</a>
      <a href="precios.html" class="hover:text-red-500 transition-colors duration-200">Precios</a>
      <a href="nosotros.html" class="hover:text-red-500 transition-colors duration-200">Sobre Nosotros</a>
      <a href="contacto.html" class="hover:text-red-500 transition-colors duration-200">Contacto</a>
    </nav>

    <!-- BOTONES DERECHA ESCRITORIO -->
    <div class="hidden md:flex items-center gap-4 text-sm font-semibold">
      <a href="ingresar.html"
        class="hover:text-red-500 transition-colors duration-200">
        Ingresar
      </a>


    </div>

    <!-- BOTON HAMBURGUESA -->
    <button id="menu-btn"
      class="block md:hidden text-white text-3xl focus:outline-none">
      ☰
    </button>

  </div>

  <!-- MENU MOBILE -->
  <div id="mobile-menu"
    class="hidden md:hidden flex flex-col gap-4 mt-6 text-gray-300 text-lg font-medium">

    <a href="../index.html" class="hover:text-red-500">Inicio</a>
    <a href="precios.html" class="hover:text-red-500">Precios</a>
    <a href="nosotros.html" class="hover:text-red-500">Sobre Nosotros</a>
    <a href="contacto.html" class="hover:text-red-500">Contacto</a>

    <hr class="border-gray-800">

    <a href="ingresar.html" class="hover:text-red-500">
      Ingresar
    </a>


  </div>

</header>

  <!-- CONTENIDO: FORMULARIO -->
  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">Crea tu cuenta</h1>
        <p class="text-sm text-gray-400">Empezá a automatizar tu negocio hoy mismo.</p>
      </div>

      <form class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Nombre completo</label>
          <input type="text" placeholder="Introduzca su nombre" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-red-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Correo Electrónico</label>
          <input type="email" placeholder="tu@empresa.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-red-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Contraseña</label>
          <input type="password" placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-red-500 transition">
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="terms" class="rounded bg-gray-950 border-gray-800 text-red-500 focus:ring-0">
          <label id="terms" class="text-xs text-gray-400">Acepto los términos y condiciones de servicio.</label>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-900/20">
          Registrar Empresa
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-gray-900/40 border-t border-gray-900 py-6 text-center px-6">
    <p class="text-xs sm:text-sm text-gray-500 max-w-2xl mx-auto">
       Tenemos un equipo de más de <span class="text-gray-300 font-semibold">10 profesionales</span> trabajando para ofrecerte el mejor servicio del mercado.
    </p>
    <div class= "animate-pulse">
  <a href="../index.html" class="text-white border-b-2 border-red-500 pb-1">Volver al inicio</a>
    </div>
  </footer>
  <script>
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>
</body>
</html>
